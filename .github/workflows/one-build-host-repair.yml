name: One-build host regression audit

on:
  push:
    branches:
      - fix/one-build-host-test-failures
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-host-suite:
    name: Exact-source host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Download exact source through GitHub REST API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://api.github.com/repos/gobbajogger/X0X37-for-Loopy-Pro/zipball/${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/one-build-source.zip"
          mkdir -p "$RUNNER_TEMP/one-build-archive" source
          unzip -q "$RUNNER_TEMP/one-build-source.zip" -d "$RUNNER_TEMP/one-build-archive"
          root=$(find "$RUNNER_TEMP/one-build-archive" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          cp -a "$root"/. source/
          test -f source/tests/run_tests.sh
          mkdir -p source/build/ci
          printf 'repo=%s\ncommit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" | tee source/build/ci/source-identity.log
          (cd source && cc --version | head -1) | tee -a source/build/ci/source-identity.log

      - name: Verify approved original build headers from PR 721
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://api.github.com/repos/gobbajogger/X0X37-for-Loopy-Pro/zipball/e189819d817dd3c59b4a1d219bf93be9f065d8d7' \
            -o "$RUNNER_TEMP/pr721-headers.zip"
          python3 - "$RUNNER_TEMP/pr721-headers.zip" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path('source')
          manifest = json.loads((root/'experiments/original_synth/EXTERNAL-INPUTS.json').read_text())
          inputs = manifest['excluded_data_inputs']
          extras = {'experiments/original_synth/state_codec_private.h': '8df3640fb7cd6a0547f26f3543cb8af0c502a0f9'}
          with zipfile.ZipFile(sys.argv[1]) as z:
              members = z.namelist()
              for record in inputs:
                  rel = record['path']
                  matches = [name for name in members if name.endswith('/' + rel)]
                  assert len(matches) == 1, (rel, len(matches))
                  raw = z.read(matches[0])
                  assert len(raw) == record['bytes'], (rel, len(raw))
                  assert hashlib.sha256(raw).hexdigest() == record['sha256'], rel
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)
              for rel, expected in extras.items():
                  matches = [name for name in members if name.endswith('/' + rel)]
                  assert len(matches) == 1, (rel, len(matches))
                  raw = z.read(matches[0])
                  blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  assert blob == expected, (rel, blob)
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)
          print('Approved private build inputs: 13/13 verified', flush=True)
          PY
          cd source
          python3 tools/check_original_inputs.py --scope all > build/ci/original-inputs-check.log

      - name: Install host image dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/one-build-host-venv"
          "$RUNNER_TEMP/one-build-host-venv/bin/python3" -m pip install --disable-pip-version-check Pillow
          echo "$RUNNER_TEMP/one-build-host-venv/bin" >> "$GITHUB_PATH"

      - name: Build host simulator
        id: build
        shell: bash
        working-directory: source
        run: |
          set -o pipefail
          sh host/build_host.sh 2>&1 | tee build/ci/host-build.log

      - name: Run entire host suite
        id: tests
        if: always()
        shell: bash
        working-directory: source
        run: |
          set -uo pipefail
          X0X_TEST_JOBS=4 sh tests/run_tests.sh 2>&1 | tee build/ci/full-host-suite.log

      - name: Upload text-only host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-build-host-repair-logs
          path: |
            source/build/ci/*.log
            source/build/host/.results/*.fail
            source/build/host/.results/*.time
            source/build/host/.results/*.log
          if-no-files-found: warn
          retention-days: 7