name: PR700 source transport
on:
  push:
    branches:
      - smc-a-port-20261029

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact one-build source through GitHub REST API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: cb5423c4aad7d9fc0c3e0a532c2aac080f3cfd21
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/gobbajogger/X0X37-for-Loopy-Pro/tarball/${BASE_SHA}" \
            > source.tar.gz
          test -s source.tar.gz
          tar -tzf source.tar.gz > source-files.txt
          sha256sum source.tar.gz > source.sha256

      - name: Upload exact public source
        uses: actions/upload-artifact@v4
        with:
          name: pr700-one-build-cb5423c4
          path: |
            source.tar.gz
            source.sha256
            source-files.txt
          if-no-files-found: error
          retention-days: 1
