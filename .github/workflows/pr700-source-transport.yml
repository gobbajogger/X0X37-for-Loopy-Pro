name: PR700 source transport
on:
  push:
    branches:
      - smc-a-port-20261029

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact one-build source through GitHub REST API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: cb5423c4aad7d9fc0c3e0a532c2aac080f3cfd21
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: LoopyX0X37-source-transport" \
            "https://api.github.com/repos/gobbajogger/X0X37-for-Loopy-Pro/tarball/${BASE_SHA}" \
            -o source.tar.gz
          sha256sum source.tar.gz > source.sha256
          tar -tzf source.tar.gz > source-files.txt
          grep -F "cb5423c4aad7d9fc0c3e0a532c2aac080f3cfd21" /dev/null || true

      - name: Upload exact public source
        uses: actions/upload-artifact@v4
        with:
          name: pr700-one-build-cb5423c4
          path: |
            source.tar.gz
            source.sha256
            source-files.txt
          if-no-files-found: error
          retention-days: 1
