name: One-build integrated Linux host validation

on:
  push:
    branches:
      - wip/one-build-host-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-host:
    name: Build host and run integrated regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record source and compiler identity
        shell: bash
        run: |
          set -eu
          mkdir -p build/ci
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; git status --porcelain; uname -sm; cc --version | head -1; node --version; python3 --version; } | tee build/ci/source-identity.log

      - name: Prepare isolated host Python tools
        shell: bash
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/x0x37-host-venv"
          "$RUNNER_TEMP/x0x37-host-venv/bin/python3" -m pip install --disable-pip-version-check Pillow
          echo "$RUNNER_TEMP/x0x37-host-venv/bin" >> "$GITHUB_PATH"

      - name: Build and test exact integrated source
        id: checks
        shell: bash
        run: |
          set -u
          mkdir -p build/ci
          fail=0
          run_case() {
            name="$1"
            shift
            printf 'RUN %s\n' "$name"
            "$@" > "build/ci/$name.log" 2>&1
            code=$?
            printf '%s\n' "$code" > "build/ci/$name.exit"
            if [ "$code" -eq 0 ]; then
              printf 'PASS %s\n' "$name"
            else
              printf 'FAIL %s (exit %s)\n' "$name" "$code"
              tail -30 "build/ci/$name.log" || true
              fail=1
            fi
          }
          run_case host-simulator bash host/build_host.sh
          run_case original-composition python3 tests/host/test_original_build_composition.py
          run_case freeplay-compiled python3 tests/host/test_freeplay_rate_pad_port.py
          run_case rate-pad-selector sh tests/run_tests.sh freeplay-rate-pads
          run_case all-host-tests env X0X_TEST_JOBS=4 sh tests/run_tests.sh
          printf '%s\n' "$fail" > build/ci/final.exit
          exit "$fail"

      - name: Preserve actual logs and exit codes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-build-integrated-host
          path: |
            build/ci/
            build/host/*.log
            build/host/.results/
            build/scenarios/**/*.log
          if-no-files-found: warn
          retention-days: 14
