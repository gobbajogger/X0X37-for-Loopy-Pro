# Read-only, deterministic regressions. The separate hourly AI bugfinder is not
# run by this workflow; firmware builds, hardware flashes and Pages publication
# are explicitly out of scope.
name: LoopyX0X37 20-minute smoke bugfinder

on:
  schedule:
    # Offset from :00, where GitHub Actions scheduled runs are often delayed.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bugfinder-smoke.yml
      - tools/run_bugfinder_smoke.sh

permissions:
  contents: read

concurrency:
  group: bugfinder-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only web and sample-safety regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run independent regression checks
        shell: bash
        run: bash tools/run_bugfinder_smoke.sh

      - name: Attach check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfinder-smoke-logs
          path: build/bugfinder/run.*/
          if-no-files-found: warn
          retention-days: 7
