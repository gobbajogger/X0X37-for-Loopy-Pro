name: SMC Linux host regressions

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/smc-host-regressions.yml
      - tests/run_tests.sh
      - tests/host/smc_*.py
      - tests/host/smc_*.c
      - tests/host/smc_*.sh
      - tests/host/project_*.c
      - tests/host/project_*.sh
      - tests/host/run_project_*.sh
      - firmware/src/app/smc_mixer.c
      - firmware/src/app/smc_protocol.h
      - firmware/src/app/project.c
      - firmware/src/ble/ble_midi_central.c
      - firmware/src/seq/pattern.h
  push:
    branches:
      - main
    paths:
      - .github/workflows/smc-host-regressions.yml
      - tests/run_tests.sh
      - tests/host/smc_*.py
      - tests/host/smc_*.c
      - tests/host/smc_*.sh
      - tests/host/project_*.c
      - tests/host/project_*.sh
      - tests/host/run_project_*.sh
      - firmware/src/app/smc_mixer.c
      - firmware/src/app/smc_protocol.h
      - firmware/src/app/project.c
      - firmware/src/ble/ble_midi_central.c
      - firmware/src/seq/pattern.h
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smc-host:
    name: Focused SMC host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run SMC regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci
          X0X_TEST_JOBS=1 sh tests/run_tests.sh \
            smc-protocol smc-fader smc-buttons smc-mapping \
            smc-reachability smc-queue smc-link smc-drum-mutes \
            smc-drum-rs smc-feedback smc-record-feedback smc-filter \
            smc-part-select smc-clip-visibility \
            project-protocol project-stage project-runtime \
            2>&1 | tee build/ci/smc-host-regressions.log

      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-host-regression-logs
          path: |
            build/ci/smc-host-regressions.log
            build/host/smc-*.log
          if-no-files-found: warn
          retention-days: 14
