# Generate and TEST a Pages preview. This workflow must NEVER publish firmware.
# The designated site owner publishes fully gated DEV candidates separately,
# using tools/publish_pages.sh (normal history-preserving gh-pages push only).
name: GitHub Pages preview

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/make_pages.py"
      - "tools/publish_pages.sh"
      - "tools/publish_pages_ff.sh"
      - "docs/MANUAL.md"
      - "docs/NEW.md"
      - "docs/img/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional existing release version to preview (tag without v)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch existing Pages catalog and assets (preview only)
        run: |
          set -euo pipefail
          mkdir -p build/pages-prev
          git fetch -q origin gh-pages --depth=1
          SHA="$(git rev-parse --verify FETCH_HEAD)"
          git archive "$SHA" | tar -xf - -C build/pages-prev

      - name: Resolve optional release packages
        id: pkgs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p build/dl
          PRO=""; ELITE=""; MKE=""; FM1=""
          if [ -n "$V" ]; then
            TAG="v$V"
            gh release download "$TAG" -D build/dl -p "*.fwsc" \
              || gh release download "$V" -D build/dl -p "*.fwsc" \
              || true
            PRO=$(ls build/dl/x0x-smk37-"$V".fwsc build/dl/x0x37-"$V".fwsc 2>/dev/null | head -1 || true)
            ELITE=$(ls build/dl/x0x-smk37-elite-"$V".fwsc build/dl/x0x37-"$V"-elite.fwsc 2>/dev/null | head -1 || true)
            MKE=$(ls build/dl/x0x-smk37-mke-"$V".fwsc build/dl/x0x37-"$V"-mke.fwsc 2>/dev/null | head -1 || true)
            FM1=$(ls build/dl/x0x-"$V".fwsc 2>/dev/null | head -1 || true)
          fi
          echo "pro=$PRO" >> "$GITHUB_OUTPUT"
          echo "elite=$ELITE" >> "$GITHUB_OUTPUT"
          echo "mke=$MKE" >> "$GITHUB_OUTPUT"
          echo "fm1=$FM1" >> "$GITHUB_OUTPUT"

      - name: Build and test preview
        run: |
          set -euo pipefail
          V="${{ steps.pkgs.outputs.version }}"
          MERGE=()
          if [ -f build/pages-prev/versions.json ] || [ -d build/pages-prev/firmware ]; then
            MERGE=(--merge build/pages-prev)
          fi
          if [ -n "${{ steps.pkgs.outputs.pro }}${{ steps.pkgs.outputs.elite }}${{ steps.pkgs.outputs.mke }}${{ steps.pkgs.outputs.fm1 }}" ]; then
            ARGS=(--version "$V" --out build/pages "${MERGE[@]}")
            [ -n "${{ steps.pkgs.outputs.pro }}" ] && ARGS+=(--pro "${{ steps.pkgs.outputs.pro }}")
            [ -n "${{ steps.pkgs.outputs.elite }}" ] && ARGS+=(--elite "${{ steps.pkgs.outputs.elite }}")
            [ -n "${{ steps.pkgs.outputs.mke }}" ] && ARGS+=(--mke "${{ steps.pkgs.outputs.mke }}")
            [ -n "${{ steps.pkgs.outputs.fm1 }}" ] && ARGS+=(--fm1 "${{ steps.pkgs.outputs.fm1 }}")
            python3 tools/make_pages.py "${ARGS[@]}"
          else
            python3 tools/make_pages.py --shell --out build/pages "${MERGE[@]}"
          fi
          python3 tests/make_pages_test.py
          python3 tests/host/pages_publish_ff_test.py

      - name: Upload preview artifact (not a site deployment)
        uses: actions/upload-artifact@v4
        with:
          name: x0x-pages-preview
          path: build/pages
          if-no-files-found: error
          retention-days: 7
