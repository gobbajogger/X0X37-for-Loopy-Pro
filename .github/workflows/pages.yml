# Host the install site on GitHub Pages (gh-pages branch + Actions deploy),
# the same pattern other FM-1/SMK firmware projects use.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/make_pages.py"
      - "tools/publish_pages.sh"
      - "docs/MANUAL.md"
      - "docs/NEW.md"
      - "docs/img/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version to merge (tag without v)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch previous gh-pages site for version merge
        continue-on-error: true
        run: |
          mkdir -p build/pages-prev
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages | tar -x -C build/pages-prev
          fi

      - name: Resolve optional release packages
        id: pkgs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p build/dl
          PRO=""; ELITE=""; MKE=""; FM1=""
          if [ -n "$V" ]; then
            TAG="v$V"
            gh release download "$TAG" -D build/dl -p "*.fwsc" \
              || gh release download "$V" -D build/dl -p "*.fwsc" \
              || true
            PRO=$(ls build/dl/x0x-smk37-"$V".fwsc build/dl/x0x37-"$V".fwsc 2>/dev/null | head -1 || true)
            ELITE=$(ls build/dl/x0x-smk37-elite-"$V".fwsc build/dl/x0x37-"$V"-elite.fwsc 2>/dev/null | head -1 || true)
            MKE=$(ls build/dl/x0x-smk37-mke-"$V".fwsc build/dl/x0x37-"$V"-mke.fwsc 2>/dev/null | head -1 || true)
            FM1=$(ls build/dl/x0x-"$V".fwsc 2>/dev/null | head -1 || true)
          fi
          echo "pro=$PRO" >> "$GITHUB_OUTPUT"
          echo "elite=$ELITE" >> "$GITHUB_OUTPUT"
          echo "mke=$MKE" >> "$GITHUB_OUTPUT"
          echo "fm1=$FM1" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: |
          set -euo pipefail
          V="${{ steps.pkgs.outputs.version }}"
          MERGE=()
          if [ -f build/pages-prev/versions.json ] || [ -d build/pages-prev/firmware ]; then
            MERGE=(--merge build/pages-prev)
          fi
          if [ -n "${{ steps.pkgs.outputs.pro }}${{ steps.pkgs.outputs.elite }}${{ steps.pkgs.outputs.mke }}${{ steps.pkgs.outputs.fm1 }}" ]; then
            ARGS=(--version "$V" --out build/pages "${MERGE[@]}")
            [ -n "${{ steps.pkgs.outputs.pro }}" ] && ARGS+=(--pro "${{ steps.pkgs.outputs.pro }}")
            [ -n "${{ steps.pkgs.outputs.elite }}" ] && ARGS+=(--elite "${{ steps.pkgs.outputs.elite }}")
            [ -n "${{ steps.pkgs.outputs.mke }}" ] && ARGS+=(--mke "${{ steps.pkgs.outputs.mke }}")
            [ -n "${{ steps.pkgs.outputs.fm1 }}" ] && ARGS+=(--fm1 "${{ steps.pkgs.outputs.fm1 }}")
            python3 tools/make_pages.py "${ARGS[@]}"
          else
            # Hostable shell: installer + sample importer; drop any .fwsc; Releases API fills versions later.
            python3 tools/make_pages.py --shell --out build/pages "${MERGE[@]}"
          fi
          python3 tests/make_pages_test.py

      - name: Push gh-pages branch (classic Pages source)
        run: |
          set -euo pipefail
          cd build/pages
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "GitHub Pages site from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Succeeds once Pages is enabled for the repo; gh-pages push above already hosts the files.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
